<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroClient - Downloader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Aero<span class="highlight">Client</span></h1>
        <p>Cole o link do vídeo abaixo para começar o download.</p>
        
        <div class="input-group">
            <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
            <button id="downloadBtn">Baixar Vídeo</button>
        </div>

        <!-- Área onde mostraremos o status ou o link final -->
        <div id="statusArea" class="hidden">
            <p id="statusMessage">Aguardando...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
